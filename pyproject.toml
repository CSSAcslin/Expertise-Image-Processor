[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "expertise-image-processor"
version = "0.7.1"
description = "Local image/video preview and extensible processing workbench"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "numpy>=2.1,<3", "Pillow>=11,<13", "tifffile>=2025.1", "av>=16,<20", "matplotlib>=3.11,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
desktop = ["PySide6>=6.8,<7"]

[project.scripts]
eip = "eip.__main__:main"
eip-desktop = "eip.__main__:desktop_main"

[tool.setuptools.package-data]
"eip.web" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
