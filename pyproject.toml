[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "expertise-image-processor"
version = "0.1.0"
description = "Local image/video preview and extensible processing workbench"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6>=6.8,<7", "numpy>=2.1,<3", "Pillow>=11,<13", "tifffile>=2025.1", "av>=16,<20"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
eip = "eip.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
